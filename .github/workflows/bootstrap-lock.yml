name: Repair pilot type-definition lock
on:
  push:
    branches: [feat/pilot-foundation]
    paths: [.github/workflows/bootstrap-lock.yml]
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'Vasuki8/us-national-park-trip-readiness-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update lock without executing lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-npm-lock
          path: package-lock.json
          retention-days: 7
  commit-lock:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repaired-npm-lock
          path: lock
      - name: Commit only the corrected lockfile
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const branch = 'feat/pilot-foundation';
            if (context.repo.owner !== 'Vasuki8' || context.repo.repo !== 'us-national-park-trip-readiness-tracker' || context.ref !== `refs/heads/${branch}`) throw new Error('Unexpected repository or ref');
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
            if (ref.object.sha !== context.sha) throw new Error('Branch moved; refusing to write');
            const content = fs.readFileSync('lock/package-lock.json');
            const lock = JSON.parse(content.toString('utf8'));
            if (lock.name !== 'park-trip-readiness' || lock.lockfileVersion !== 3 || lock.packages[''].devDependencies['@types/node'] !== '22.20.3') throw new Error('Unexpected lockfile');
            const { data: old } = await github.rest.repos.getContent({ ...context.repo, ref: branch, path: 'package-lock.json' });
            await github.rest.repos.createOrUpdateFileContents({ ...context.repo, branch, path: 'package-lock.json', sha: old.sha, message: 'build: lock explicitly declared Node development types', content: content.toString('base64') });
