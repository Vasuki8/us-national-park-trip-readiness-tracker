name: Initialize pilot lockfile
on:
  push:
    branches: [feat/pilot-foundation]
    paths: [.github/workflows/bootstrap-lock.yml]
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'Vasuki8/us-national-park-trip-readiness-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate dependency lock without lifecycle scripts
        run: |
          test ! -e package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: initial-npm-lock
          path: package-lock.json
          retention-days: 7
  commit-lock:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: initial-npm-lock
          path: lock
      - name: Commit only the generated lockfile on the unchanged feature branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const branch = 'feat/pilot-foundation';
            if (context.repo.owner !== 'Vasuki8' || context.repo.repo !== 'us-national-park-trip-readiness-tracker' || context.ref !== `refs/heads/${branch}`) throw new Error('Unexpected repository or ref');
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
            if (ref.object.sha !== context.sha) throw new Error('Branch moved; refusing to write');
            const content = fs.readFileSync('lock/package-lock.json');
            const lock = JSON.parse(content.toString('utf8'));
            if (lock.name !== 'park-trip-readiness' || lock.lockfileVersion !== 3 || lock.packages[''].dependencies.astro !== '7.3.5') throw new Error('Unexpected lockfile');
            await github.rest.repos.createOrUpdateFileContents({ ...context.repo, branch, path: 'package-lock.json', message: 'build: lock verified pilot dependency versions', content: content.toString('base64') });
