name: Entry HTML compatibility diagnostic
on:
  workflow_dispatch:
  push:
    branches: [feat/pilot-foundation]
    paths: [.github/workflows/entry-compatibility.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Vasuki8/us-national-park-trip-readiness-tracker' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[entry-compat-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture five fixed sources and replay in a temporary private ledger
        run: python -m tracker.entry_compatibility --live
